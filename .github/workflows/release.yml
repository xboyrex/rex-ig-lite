name: Release RexPrime Patch Bundle

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v3.10.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Build & Release RexPrime (.mpp)
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - name: Build RexPrime .mpp Bundle & Patch List
        run: |
          chmod +x gradlew
          ./gradlew checkStringResources generatePatchesList --no-daemon

      - name: Upload RexPrime .mpp Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rex-ig-lite-patches-mpp
          path: |
            patches/build/libs/*.mpp
            !patches/build/libs/*-sources.mpp
            !patches/build/libs/*-javadoc.mpp
            patches-list.json
          if-no-files-found: error

      - name: Generate bundle.json & Publish GitHub Release
        run: |
          MPP_FILE=$(find patches/build/libs -maxdepth 1 -name "*.mpp" ! -name "*-sources*" ! -name "*-javadoc*" | head -n 1)
          if [ -z "$MPP_FILE" ]; then
            echo "No .mpp file found in patches/build/libs!"
            exit 1
          fi
          MPP_BASENAME=$(basename "$MPP_FILE")
          VERSION_RAW=$(grep "^version" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          TAG_NAME="${{ github.event.inputs.version }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v${VERSION_RAW}"
          fi
          CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%S")
          cat > bundle.json <<EOF
          {
            "version": "${TAG_NAME}",
            "created_at": "${CREATED_AT}",
            "description": "RexPrime Unified Patches by Mayank (@xboyrex)",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${MPP_BASENAME}"
          }
          EOF
          cp bundle.json patches-bundle.json

          ASSETS=("$MPP_FILE" "bundle.json" "patches-bundle.json")
          if [ -f "patches-list.json" ]; then
            ASSETS+=("patches-list.json")
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}"               --title "RexPrime Patches ${TAG_NAME}"               --notes "Automated RexPrime (.mpp) patch bundle release by Mayank (@xboyrex)."
          fi
