name: Build & Release xboyrex Patches (.mpp)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Compile & Release xboyrex (.mpp)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Morphe Patches Bundle (.mpp)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build

      - name: Upload Compiled .mpp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xboyrex-patches-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error

      - name: Publish GitHub Release & Update Morphe Bundle JSON
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          TAG="v${VERSION}"
          MPP_FILE=$(ls patches/build/libs/patches-*.mpp | grep -v 'sources' | grep -v 'javadoc' | head -n 1)
          if [ -z "$MPP_FILE" ]; then
            echo "No .mpp file found!"
            exit 1
          fi
          ASSET_NAME="patches-${VERSION}.mpp"
          cp "$MPP_FILE" "$ASSET_NAME"

          CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%S")
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_NAME}"
          export VERSION CREATED_AT DOWNLOAD_URL

          python3 - <<'PYCODE'
          import json
          import os

          version = os.environ["VERSION"]
          created_at = os.environ["CREATED_AT"]
          download_url = os.environ["DOWNLOAD_URL"]

          data = {
              "created_at": created_at,
              "description": (
                  f"## v{version} — xboyrex Unified Liquid Glass Instagram & X Patch Suite\n\n"
                  "- Full Instagram & X bytecode patch suite by Mayank (@xboyrex)\n"
                  "- SakuraTunes-style Liquid Glass About UI + Real-Time Gaussian Blur\n"
                  "- Zero-Prompt MediaStore Direct Download on Redmi/HyperOS"
              ),
              "download_url": download_url,
              "signature_download_url": "",
              "version": version,
          }
          for out_name in ("patches-bundle.json", "bundle.json"):
              with open(out_name, "w") as f:
                  json.dump(data, f, indent=2)
          PYCODE

          RELEASE_FILES=("$ASSET_NAME" "patches-bundle.json" "bundle.json")
          if [ -f "patches-list.json" ]; then
            RELEASE_FILES+=("patches-list.json")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${RELEASE_FILES[@]}" --clobber
          else
            gh release create "$TAG" "${RELEASE_FILES[@]}" \
              --title "xboyrex Patches ${TAG}" \
              --notes "Automated xboyrex (.mpp) Android patch bundle release (${TAG}) by Mayank (@xboyrex)."
          fi

          rm -f bundle.json "$ASSET_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(bundle): update patches-bundle.json for ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
