name: Build RexPrime Patches (.mpp)

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build RexPrime (.mpp)
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check string resources & Build RexPrime .mpp Patch Bundle
        run: ./gradlew checkStringResources generatePatchesList --no-daemon

      - name: Upload RexPrime .mpp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rex-ig-lite-patches-mpp
          path: |
            patches/build/libs/*.mpp
            !patches/build/libs/*-sources.mpp
            !patches/build/libs/*-javadoc.mpp
            patches-list.json
          if-no-files-found: error
